<header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 19 20 7l14 12v13a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="var(--accent)" opacity=".18"/><path d="M6 19 20 7l14 12" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="23.5" r="7.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><path d="M20 19.5v4.3l2.8 1.8" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><div class="brand-name">Timrom<span>.</span></div><div class="brand-tag">Your time builds a home<span class="prototype-label">Local prototype · sample people &amp; coins</span></div></div>
    </div>
    <nav class="modes" role="tablist" aria-label="View">
      <button role="tab" data-mode="home" [disabled]="!ready()" [class.on]="selected('home', '')" [attr.aria-selected]="selected('home', '')" (click)="navigate.emit({mode: 'home', spawn: ''})"><svg class="i"><use href="#i-home"/></svg>Home <span class="live" id="liveDot"></span></button>
      <button role="tab" data-mode="build" [disabled]="!ready()" [class.on]="selected('build', '')" [attr.aria-selected]="selected('build', '')" (click)="navigate.emit({mode: 'build', spawn: ''})"><svg class="i"><use href="#i-bag"/></svg>Build &amp; buy</button>
      <button role="tab" data-mode="hood" [disabled]="!ready()" [class.on]="selected('hood', '')" [attr.aria-selected]="selected('hood', '')" (click)="navigate.emit({mode: 'hood', spawn: ''})"><svg class="i"><use href="#i-map"/></svg>Neighbourhood</button>
      <button role="tab" data-mode="park" data-spawn="gate" [disabled]="!ready()" [class.on]="selected('park', 'gate')" [attr.aria-selected]="selected('park', 'gate')" (click)="navigate.emit({mode: 'park', spawn: 'gate'})"><svg class="i"><use href="#i-tree"/></svg>Explore</button>
      <button role="tab" data-mode="park" data-spawn="park" [disabled]="!ready()" [class.on]="selected('park', 'park')" [attr.aria-selected]="selected('park', 'park')" (click)="navigate.emit({mode: 'park', spawn: 'park'})"><svg class="i"><use href="#i-leaf"/></svg>Park</button>
    </nav>
    <div class="wallet">
      <div class="chip streak" id="streakChip" title="Great Day streak"><svg class="i"><use href="#i-flame"/></svg><b class="num" id="streakN">0</b></div>
      <div class="chip coins" id="coinChip" title="Sample coins · real rewards are not connected yet"><svg class="i"><use href="#i-coin"/></svg><b class="num" id="coinN">0</b></div>
      <button class="icon-btn chat-btn" id="chatBtn" [disabled]="!ready()" (click)="messages.emit()" aria-label="Messages"><svg class="i"><use href="#i-chat"/></svg><span class="badge" id="chatBadge" hidden>0</span></button>
      <button class="icon-btn" id="settingsBtn" [disabled]="!ready()" (click)="settings.emit()" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </header>
