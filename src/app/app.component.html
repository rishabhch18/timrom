<div class="app" id="app">
  <timrom-header [mode]="world.snapshot().mode" [spawn]="world.snapshot().spawn" [ready]="world.snapshot().ready"
    (navigate)="world.navigate($event)" (messages)="world.toggleChat()" (settings)="world.openSettings()" />
  <timrom-world />
</div>
@if (error()) { <div class="startup-error" role="alert"><h1>Timrom could not start</h1><p>{{ error() }}</p><button (click)="reload()">Reload</button></div> }
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
